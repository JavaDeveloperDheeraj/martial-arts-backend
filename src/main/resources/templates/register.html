<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .form-container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn-submit { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        .btn-submit:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Student Registration Form</h2>
    
    <form action="/api/student/register" method="POST" enctype="multipart/form-data">
    
    <div class="form-group">
        <label>Full Name:</label>
        <input type="text" name="name" required />
    </div>
    
    <div class="form-group">
        <label>Email Address:</label>
        <input type="email" name="email" required />
    </div>
    
    <div class="form-group">
        <label>Mobile Number:</label>
        <input type="text" name="mobile" required />
    </div>
    
    <div class="form-group">
        <label>Enter OTP:</label>
        <input type="text" name="userOtp" required />
    </div>
    
    <div class="form-group">
        <label>Upload Photo:</label>
        <input type="file" name="photo" accept="image/jpeg" required />
    </div>
    
    <div class="form-group">
        <label>Upload Signature:</label>
        <input type="file" name="signature" accept="image/png" required />
    </div>
    
    <button type="submit">Submit Application</button>
</form>
</div>

</body>
</html>
